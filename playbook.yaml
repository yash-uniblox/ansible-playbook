---
- name: Prepare Ubuntu server
  hosts: test
  become: true

  tasks:

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install required packages
      ansible.builtin.apt:
        name:
          - curl
          - wget
          - git
          - vim
          - unzip
          - jq
          - python3
          - python3-pip
        state: present
