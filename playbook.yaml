---
- name: Prepare Ubuntu server
  hosts: test
  become: true

  tasks:

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install required packages
      ansible.builtin.apt:
        name:
          - curl
          - wget
          - git
          - vim
          - unzip
          - jq
          - python3
          - python3-pip
        state: present

    - name: Install Docker
      ansible.builtin.apt:
        name: docker.io
        state: present
        update_cache: true

    - name: Create RKE2 configuration directory
      ansible.builtin.file:
        path: /etc/rancher/rke2
        state: directory
        mode: "0755"

    - name: Configure RKE2
      ansible.builtin.copy:
        dest: /etc/rancher/rke2/config.yaml
        mode: "0644"
        content: |
          write-kubeconfig-mode: "0644"
          disable:
            - rke2-ingress-nginx
          cni: canal

    - name: Download RKE2 installation script
      ansible.builtin.get_url:
        url: https://get.rke2.io
        dest: /tmp/install-rke2.sh
        mode: "0755"

    - name: Install RKE2
      ansible.builtin.command:
        cmd: /tmp/install-rke2.sh
        creates: /usr/local/bin/rke2
      when: ansible_service_mgr == "systemd"
      
