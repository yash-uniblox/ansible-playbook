---
- name: Prepare Ubuntu server
  hosts: test
  become: true

  tasks:

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install required packages
      ansible.builtin.apt:
        name:
          - curl
          - wget
          - git
          - vim
          - unzip
          - jq
          - python3
          - python3-pip
          - zstd
          - gh
        state: present

    - name: Install Docker
      ansible.builtin.apt:
        name: docker.io
        state: present
        update_cache: true

    - name: Create RKE2 configuration directory
      ansible.builtin.file:
        path: /etc/rancher/rke2
        state: directory
        mode: "0755"

    - name: Configure RKE2
      ansible.builtin.copy:
        dest: /etc/rancher/rke2/config.yaml
        mode: "0644"
        content: |
          write-kubeconfig-mode: "0644"
          disable:
            - rke2-ingress-nginx
          cni: canal

    - name: Download RKE2 installation script
      ansible.builtin.get_url:
        url: https://get.rke2.io
        dest: /tmp/install-rke2.sh
        mode: "0755"

    - name: Install RKE2
      ansible.builtin.command:
        cmd: /tmp/install-rke2.sh
        creates: /usr/local/bin/rke2

    - name: Create kubeconfig directory
      ansible.builtin.file:
        path: "/home/{{ ansible_user }}/.kube"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0700"
      when: ansible_service_mgr == "systemd"

    - name: Copy RKE2 kubeconfig
      ansible.builtin.copy:
        src: /etc/rancher/rke2/rke2.yaml
        dest: "/home/{{ ansible_user }}/.kube/config"
        remote_src: true
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0600"
      when: ansible_service_mgr == "systemd"

    - name: Enable and start RKE2 server
      ansible.builtin.systemd:
        name: rke2-server
        enabled: true
        state: started
      when: ansible_service_mgr == "systemd"


    - name: Check if RKE2 kubectl exists
      ansible.builtin.stat:
        path: /var/lib/rancher/rke2/bin/kubectl
      register: rke2_kubectl

    - name: Create kubectl symlink
      ansible.builtin.file:
        src: /var/lib/rancher/rke2/bin/kubectl
        dest: /usr/local/bin/kubectl
        state: link
        force: true
        follow: false
      when: rke2_kubectl.stat.exists
     
    - name: Download Helm installation script
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
        dest: /tmp/install-helm.sh
        mode: "0755"

    - name: Install Helm
      ansible.builtin.command:
        cmd: /tmp/install-helm.sh
        creates: /usr/local/bin/helm 

    - name: Add Longhorn Helm repository
      kubernetes.core.helm_repository:
        name: longhorn
        repo_url: https://charts.longhorn.io
      when: ansible_service_mgr == "systemd"

    - name: Create Longhorn namespace
      kubernetes.core.k8s:
        name: longhorn-system
        api_version: v1
        kind: Namespace
        state: present
      when: ansible_service_mgr == "systemd"

    - name: Install Longhorn
      kubernetes.core.helm:
        name: longhorn
        chart_ref: longhorn/longhorn
        release_namespace: longhorn-system
        create_namespace: false
        state: present
      when: ansible_service_mgr == "systemd"

    - name: Add Traefik Helm repository
      kubernetes.core.helm_repository:
        name: traefik
        repo_url: https://traefik.github.io/charts
      when: ansible_service_mgr == "systemd"

    - name: Create Traefik namespace
      kubernetes.core.k8s:
        name: traefik
        api_version: v1
        kind: Namespace
        state: present
      when: ansible_service_mgr == "systemd"

    - name: Install Traefik
      kubernetes.core.helm:
        name: traefik
        chart_ref: traefik/traefik
        release_namespace: traefik
        create_namespace: false
        state: present
      when: ansible_service_mgr == "systemd"

    - name: Download Ollama installation script
      ansible.builtin.get_url:
        url: https://ollama.com/install.sh
        dest: /tmp/install-ollama.sh
        mode: "0755"

    - name: Install Ollama
      ansible.builtin.command:
        cmd: /tmp/install-ollama.sh
        creates: /usr/local/bin/ollama

    - name: Enable and start Ollama service
      ansible.builtin.systemd:
        name: ollama
        enabled: true
        state: started
      when: ansible_service_mgr == "systemd"

    - name: Create GitHub Actions runner directory
      ansible.builtin.file:
        path: /opt/actions-runner
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0755"
      when: ansible_service_mgr == "systemd"
